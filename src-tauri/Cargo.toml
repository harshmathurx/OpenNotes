[package]
name = "opennotes"
version = "0.1.1"
description = "OpenNotes desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opennotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
url = "2"
